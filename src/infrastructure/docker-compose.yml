name: stock_container
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stock-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: huyhoanggHuyhoang@123456
    ports:
        - "1433:1433"
    volumes:
        - sqlserver_data:/var/lib/sqlserver/data
  
  
  mongodb:
    image: mongo
    container_name: stock-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/var/lib/mongodb/data
    restart: always
    environment: 
     MONGO_INITDB_ROOT_USERNAME : admin
     MONGO_INITDB_ROOT_PASSWORD : Huyhoang123!

  redis:
    image: redis:7
    container_name: stock-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:latest
    container_name: stock-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: always

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: stock-kafka-ui
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: stock
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    restart: always

volumes:
  sqlserver_data:
  mongodb_data:
  kafka_data: